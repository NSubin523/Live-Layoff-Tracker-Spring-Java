server:
  port: ${PORT:8081}
spring:
  config:
    import: optional:file:./application-local.properties
  application:
    name: layoff-tracker
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/layoff_tracker_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
firebase:
  credentials-path: classpath:firebase-credentials.json
